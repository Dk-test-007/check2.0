<template>

    <div class="footer-nav">

        <div class="footer-left">

            <div style="display:none">
                {nfuClosed}
            </div>


            <template lwc:if={showPrev}>
                <lightning-button
                    label="Prev"
                    icon-name="utility:chevronleft"
                    onclick={handlePrev}>
                </lightning-button>
            </template>

            <template lwc:if={nfuClosed}>
                <lightning-button
                    label="NFU Closed"
                    variant="destructive"
                    disabled
                    class="nfuButton">
                </lightning-button>
            </template>

            <template lwc:else>
                <lightning-button
                    label="Mark Enquiry as NFU Closed"
                    variant="brand"
                    class="nfuButton"
                    onclick={handleNFU}>
                </lightning-button>
            </template>

        </div>

        <div class="footer-right">

            <template lwc:if={showSaveEnquiry}>
                <lightning-button
                    label="Save Enquiry"
                    onclick={handleSaveEnquiry}
                    disabled={disableStep1Actions}>
                </lightning-button>
            </template>

            <template lwc:if={showContinue}>
                <lightning-button
                    variant="brand"
                    label="Save & Continue"
                    icon-name="utility:forward"
                    icon-position="right"
                    onclick={handleContinue}
                    disabled={disableStep1Actions}>
                </lightning-button>
            </template>

            <template lwc:if={showSubmit}>
                <lightning-button
                    variant="brand"
                    label="Submit"
                    icon-name="utility:success"
                    onclick={handleSubmit}>
                </lightning-button>
            </template>

        </div>

    </div>

    <!-- NFU Confirmation Modal -->

    <template lwc:if={showNFUConfirmModal}>

        <section
            role="dialog"
            tabindex="-1"
            class="slds-modal slds-fade-in-open">

            <div class="slds-modal__container">

                <header class="slds-modal__header">

                    <h2 class="slds-text-heading_medium">
                        Mark Enquiry as NFU
                    </h2>

                </header>

                <div class="slds-modal__content slds-p-around_large">

                    Are you sure you want to mark this enquiry as NFU?

                </div>

                <footer class="slds-modal__footer">

                    <lightning-button
                        label="Cancel"
                        onclick={closeNFUModal}>
                    </lightning-button>

                    <lightning-button
                        variant="brand"
                        label="Yes"
                        onclick={openCommentsModal}
                        class="add-left-margin">
                    </lightning-button>

                </footer>

            </div>

        </section>

        <div class="slds-backdrop slds-backdrop_open"></div>

    </template>

    <!-- NFU Comments Modal -->

    <template lwc:if={showCommentsModal}>

        <section
            role="dialog"
            tabindex="-1"
            class="slds-modal slds-fade-in-open">

            <div class="slds-modal__container">

                <header class="slds-modal__header">

                    <h2 class="slds-text-heading_medium">
                        NFU Closing Comments
                    </h2>

                </header>

                <div class="slds-modal__content slds-p-around_large">

                    <lightning-textarea
                        label="Closing Comments"
                        value={closingComments}
                        onchange={handleClosingComments}>
                    </lightning-textarea>

                </div>

                <footer class="slds-modal__footer">

                    <lightning-button
                        label="Cancel"
                        onclick={closeCommentsModal}>
                    </lightning-button>

                    <lightning-button
                        variant="brand"
                        label="Save"
                        onclick={saveNFU}
                        class="add-left-margin">
                    </lightning-button>

                </footer>

            </div>

        </section>

        <div class="slds-backdrop slds-backdrop_open"></div>


    </template>

</template>
