<template>
    <lightning-card title="Disqualify" icon-name="utility:ban">
        <div class="slds-var-p-horizontal_medium">
            <template lwc:if={saving}>
                <lightning-spinner alternative-text="Disqualifying" size="small"></lightning-spinner>
            </template>
            <template lwc:if={error}>
                <div class="slds-text-color_error slds-var-m-bottom_small" role="alert">{error}</div>
            </template>

            <template lwc:if={isView}>
                <template lwc:if={canDisqualify}>
                    <p class="slds-var-m-bottom_small">Use this when the Lead will not go forward. It does not need the
                        stage's qualification details first.</p>
                    <lightning-button variant="destructive-text" label="Disqualify Lead" onclick={handleStart}></lightning-button>
                </template>
                <template lwc:elseif={blockedMessage}>
                    <p class="slds-text-color_weak">{blockedMessage}</p>
                </template>
            </template>

            <template lwc:if={isForm}>
                <lightning-combobox name="reason" label="Disqualified Reason" placeholder="Choose a reason"
                    options={reasonOptions} value={reason} onchange={handleReason} required></lightning-combobox>
                <lightning-textarea name="comments" label={commentsLabel} value={comments} max-length={maxLength}
                    onchange={handleComments} required={commentsRequired}
                    message-when-value-missing="Enter comments when the reason is Other."></lightning-textarea>
                <div class="slds-var-m-top_small">
                    <lightning-button label="Cancel" onclick={handleCancel} class="slds-var-m-right_x-small"></lightning-button>
                    <lightning-button variant="brand" label="Continue" onclick={handleReview}></lightning-button>
                </div>
            </template>

            <template lwc:if={isConfirm}>
                <p class="slds-var-m-bottom_x-small"><strong>Disqualify {companyName}?</strong></p>
                <p class="slds-var-m-bottom_x-small">Status becomes Disqualified. Reason: {reasonLabel}.</p>
                <template lwc:if={hasComments}>
                    <p class="slds-var-m-bottom_x-small slds-text-color_weak">Comments: {comments}</p>
                </template>
                <p class="slds-var-m-bottom_small slds-text-color_weak">After this the Lead is locked at Disqualified;
                    only an administrator can change its status.</p>
                <lightning-button label="Cancel" onclick={handleCancel} class="slds-var-m-right_x-small"></lightning-button>
                <lightning-button label="Back" onclick={handleBack} class="slds-var-m-right_x-small"></lightning-button>
                <lightning-button variant="destructive" label="Confirm Disqualify" onclick={handleConfirm}
                    disabled={saving}></lightning-button>
            </template>
        </div>
    </lightning-card>
</template>
