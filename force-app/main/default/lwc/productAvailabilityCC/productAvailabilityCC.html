<template>
    <div class="availability-container">
        <div class="search-area">
            <div class="search-row">
                <div class="search-column">
                    <lightning-input
                        type="search"
                        label="Select Products"
                        placeholder="Search by product name or code..."
                        value={searchKey}
                        onchange={handleSearchChange}>
                    </lightning-input>
                </div>

                <div class="button-column">
                    <lightning-button
                        label="Check Availability"
                        variant="brand"
                        icon-name="utility:search"
                        disabled={isCheckDisabled}
                        onclick={handleCheckAvailability}>
                    </lightning-button>
                </div>
            </div>

            <template lwc:if={isSearching}>
                <div class="product-dropdown">
                    <div class="dropdown-status">
                        Searching products...
                    </div>
                </div>
            </template>

            <template lwc:if={showSearchResults}>
                <div class="product-dropdown">
                    <ul class="slds-listbox slds-listbox_vertical"
                        role="listbox">

                        <template
                            for:each={searchResults}
                            for:item="product">

                            <li key={product.Id}
                                class="slds-listbox__item"
                                role="presentation">

                                <button
                                    class="product-option"
                                    data-id={product.Id}
                                    onclick={handleSelectProduct}
                                    role="option">

                                    <lightning-icon
                                        icon-name="standard:product"
                                        size="small">
                                    </lightning-icon>

                                    <span class="product-name">
                                        {product.Name}
                                    </span>

                                    <template lwc:if={product.ProductCode}>
                                        <span class="product-code">
                                            ({product.ProductCode})
                                        </span>
                                    </template>
                                </button>
                            </li>
                        </template>
                    </ul>
                </div>
            </template>
        </div>

        <template lwc:if={hasSelectedProducts}>
            <div class="slds-pill_container selected-products">
                <template
                    for:each={selectedProducts}
                    for:item="product">

                    <lightning-pill
                        key={product.Id}
                        label={product.Name}
                        name={product.Id}
                        onremove={handleRemoveProduct}>
                    </lightning-pill>
                </template>
            </div>
        </template>

        <template lwc:if={showSearchError}>
            <div class="slds-text-color_error slds-m-top_small">
                {searchError}
            </div>
        </template>

        <template lwc:if={isLoading}>
            <div class="slds-is-relative slds-p-around_large">
                <lightning-spinner
                    alternative-text="Checking inventory"
                    size="medium">
                </lightning-spinner>
            </div>
        </template>

        <template lwc:if={showInventoryError}>
            <div class="slds-text-color_error slds-m-top_medium">
                {inventoryError}
            </div>
        </template>

        <template lwc:if={hasInventoryResults}>
            <div class="inventory-results">
                <h2 class="slds-text-heading_medium slds-m-bottom_medium">
                    Inventory Results
                </h2>

                <template
                    for:each={inventoryGroups}
                    for:item="group">

                    <section key={group.key}
                        class="slds-box slds-m-bottom_medium">

                        <div class="product-heading">
                            <h3 class="slds-text-heading_small product-heading-name">
                                <lightning-icon
                                    icon-name="standard:product"
                                    size="small"
                                    class="slds-m-right_x-small">
                                </lightning-icon>

                                <a
                                    href={group.productUrl}
                                    target="_blank">
                                    {group.productName} | Code: {group.productCode}
                                </a>
                            </h3>

                            <div class="product-last-synced">
                                <span class="last-synced-label">
                                    Last Synced:
                                </span>

                                <template lwc:if={group.lastSynced}>
                                    <lightning-formatted-date-time
                                        value={group.lastSynced}
                                        year="numeric"
                                        month="short"
                                        day="2-digit"
                                        hour="2-digit"
                                        minute="2-digit">
                                    </lightning-formatted-date-time>
                                </template>

                                <template lwc:else>
                                    <span>—</span>
                                </template>
                            </div>
                        </div>

                        <template lwc:if={group.hasWarehouses}>
                            <div class="inventory-table-container">
                                <table
                                    class="slds-table slds-table_cell-buffer
                                           slds-table_bordered slds-table_striped
                                           slds-table_fixed-layout">

                                    <thead>
                                        <tr>
                                            <th scope="col" class="warehouse-column">
                                                Warehouse
                                            </th>
                                            <th scope="col" class="last-synced-column">
                                                Last Synced
                                            </th>
                                            <th scope="col" class="numeric-cell">
                                                Stock on Hand
                                            </th>
                                            <th scope="col" class="numeric-cell">
                                                Reserved
                                            </th>
                                            <th scope="col" class="numeric-cell">
                                                Committed
                                            </th>
                                            <th scope="col" class="numeric-cell">
                                                Restricted
                                            </th>
                                            <th scope="col" class="numeric-cell">
                                                Available
                                            </th>
                                            <th scope="col" class="numeric-cell">
                                                Available to Order
                                            </th>
                                            <th scope="col" class="numeric-cell">
                                                Receiving
                                            </th>
                                            <th scope="col" class="numeric-cell">
                                                Held
                                            </th>
                                            <th scope="col" class="numeric-cell">
                                                Entered Stock
                                            </th>
                                            <th scope="col" class="numeric-cell">
                                                Damaged
                                            </th>
                                            <th scope="col" class="numeric-cell">
                                                On Hold
                                            </th>
                                        </tr>
                                    </thead>

                                    <tbody>
                                        <template
                                            for:each={group.warehouses}
                                            for:item="row">

                                            <tr key={row.key}>
                                                <td class="warehouse-column">
                                                    <a
                                                        href={row.warehouseUrl}
                                                        target="_blank">
                                                        {row.warehouseName}
                                                    </a>
                                                </td>

                                                <td class="last-synced-column">
                                                    <template lwc:if={row.lastSynced}>
                                                        <lightning-formatted-date-time
                                                            value={row.lastSynced}
                                                            year="numeric"
                                                            month="short"
                                                            day="2-digit"
                                                            hour="2-digit"
                                                            minute="2-digit">
                                                        </lightning-formatted-date-time>
                                                    </template>

                                                    <template lwc:else>
                                                        <span>—</span>
                                                    </template>
                                                </td>

                                                <td class="numeric-cell">{row.stockOnHand}</td>
                                                <td class="numeric-cell">{row.reserved}</td>
                                                <td class="numeric-cell">{row.committed}</td>
                                                <td class="numeric-cell">{row.restricted}</td>
                                                <td class="numeric-cell">{row.available}</td>
                                                <td class="numeric-cell">{row.availableToOrder}</td>
                                                <td class="numeric-cell">{row.receiving}</td>
                                                <td class="numeric-cell">{row.held}</td>
                                                <td class="numeric-cell">{row.enteredStock}</td>
                                                <td class="numeric-cell">{row.damaged}</td>
                                                <td class="numeric-cell">{row.onHold}</td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </template>

                        <template lwc:else>
                            <div class="slds-box slds-theme_shade no-inventory-message">
                                No inventory records found for this product.
                            </div>
                        </template>
                    </section>
                </template>
            </div>
        </template>
    </div>
</template>
