<template>

    <div class="site-selection-container">

        <!-- MODE OPTIONS WHEN SITES ALREADY EXIST -->
        <template if:true={showModeOptions}>

            <div class="slds-page-header slds-page-header_record-home">
                <div class="slds-page-header__row">
                    <div class="slds-page-header__col-title">
                        <div class="slds-media">
                            <div class="slds-media__figure">
                                <lightning-icon
                                    icon-name="standard:account"
                                    size="medium">
                                </lightning-icon>
                            </div>
                            <div class="slds-media__body">
                                <div class="slds-page-header__name">
                                    <div class="slds-page-header__name-title">
                                        <h2>
                                            <span class="slds-text-heading_medium">
                                                Manage Sites
                                            </span>
                                        </h2>
                                    </div>
                                </div>
                                <p class="slds-text-body_small slds-m-top_xx-small">
                                    Manage the sites associated with this {parentObjectLabel}.
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="slds-p-around_medium">

                <div class="slds-text-title_bold slds-m-bottom_small">
                    What would you like to do?
                </div>

                <div class="slds-grid slds-wrap slds-gutters">

                    <div class="slds-col slds-size_1-of-2">
                        <button class="slds-box slds-box_small action-option" onclick={handleAddMoreSites}>
                            <div class="slds-grid slds-grid_vertical-align-center">

                                <div class="slds-col slds-grow">
                                    <div class="slds-media slds-media_center">
                                        <div class="slds-media__figure">
                                            <lightning-icon
                                                icon-name="utility:add"
                                                size="small">
                                            </lightning-icon>
                                        </div>
                                        <div class="slds-media__body">
                                            <div class="slds-text-heading_small">
                                                Add More Sites
                                            </div>
                                            <div class="slds-text-body_small slds-text-color_weak">
                                                Add additional sites to this record.
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </button>
                    </div>

                    <div class="slds-col slds-size_1-of-2">
                        <button class="slds-box slds-box_small action-option" onclick={handleChangePrimary}>
                            <div class="slds-grid slds-grid_vertical-align-center">

                                <div class="slds-col slds-grow">
                                    <div class="slds-media slds-media_center">
                                        <div class="slds-media__figure">
                                            <lightning-icon
                                                icon-name="utility:favorite"
                                                size="small">
                                            </lightning-icon>
                                        </div>
                                        <div class="slds-media__body">
                                            <div class="slds-text-heading_small">
                                                Change Shipment Site
                                            </div>
                                            <div class="slds-text-body_small slds-text-color_weak">
                                                Select a different Shipment Site.
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </button>
                    </div>

                </div>

                <div class="slds-m-top_large">

                    <div class="slds-section slds-is-open">

                        <h3 class="slds-section__title slds-theme_shade">
                            <span class="slds-truncate slds-p-horizontal_small">
                                Currently Associated Sites
                            </span>
                        </h3>

                        <div class="slds-section__content">

                            <div class="associated-sites-container">

                            <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_fixed-layout">

                                <thead>
                                    <tr class="slds-line-height_reset">
                                        <th scope="col">
                                            <div class="slds-truncate">Site Name</div>
                                        </th>
                                        <th scope="col">
                                            <div class="slds-truncate">Shipping Address</div>
                                        </th>
                                        <th scope="col">
                                            <div class="slds-truncate">Shipment Site</div>
                                        </th>
                                    </tr>
                                </thead>

                                <tbody>

                                    <template for:each={existingSites} for:item="site">

                                        <tr key={site.Id}>
                                            <td>
                                                <div class="slds-truncate" title={site.Site_Name_CC__c}>
                                                    {site.Site_Name_CC__c}
                                                </div>
                                            </td>
                                            <td>
                                                <div class="slds-truncate" title={site.Shipping_Address__c}>
                                                    {site.Shipping_Address__c}
                                                </div>
                                            </td>
                                            <td>
                                                <template if:true={site.Primary__c}>
                                                    <lightning-icon
                                                        icon-name="utility:check"
                                                        size="x-small"
                                                        variant="success"
                                                        alternative-text="Shipment Site">
                                                    </lightning-icon>
                                                </template>
                                            </td>
                                        </tr>

                                    </template>

                                </tbody>

                            </table>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

            <div class="slds-modal__footer footer-container">
                <div class="footer-actions">
                    <lightning-button
                        label="Close"
                        variant="neutral"
                        onclick={handleCancel}>
                    </lightning-button>
                </div>
            </div>

        </template>

        <!-- ADD SITES MODE -->
        <template if:true={isAddMode}>

            <template if:true={showSelectionScreen}>

                <div class="slds-page-header">
                    <div class="slds-page-header__row">

                        <div class="slds-page-header__col-title">
                            <div class="slds-media">
                                <div class="slds-media__figure">
                                    <lightning-icon
                                        icon-name="standard:account"
                                        size="medium">
                                    </lightning-icon>
                                </div>
                                <div class="slds-media__body">
                                    <template if:true={isOrderMode}>
                                        <h2 class="slds-text-heading_medium">
                                            Select Ship-to Site
                                        </h2>
                                        <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                                            Select one site to use as the Ship-to Customer No. for this Order.
                                        </p>
                                    </template>
                                    <template if:false={isOrderMode}>
                                        <h2 class="slds-text-heading_medium">
                                            Select Sites
                                        </h2>
                                        <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                                            Select the sites you want to associate with this record.
                                        </p>
                                    </template>
                                </div>
                            </div>
                        </div>

                        <div class="slds-page-header__col-actions">
                            <div class="slds-page-header__controls">
                                <div class="slds-page-header__control">
                                    <lightning-button
                                        label="Create New Site"
                                        icon-name="utility:add"
                                        variant="neutral"
                                        onclick={handleCreateSite}>
                                    </lightning-button>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>

                <div class="slds-p-around_medium">

                    <!-- SEARCH AND SHOW SELECTED -->
                    <div class="slds-grid slds-grid_vertical-align-center slds-gutters slds-m-bottom_small">

                        <div class="slds-col slds-grow">
                            <lightning-input
                                type="search"
                                variant="label-hidden"
                                placeholder="Search Sites..."
                                value={searchTerm}
                                onchange={handleSearch}>
                            </lightning-input>
                        </div>

                        <div class="slds-col slds-grow-none">
                            <lightning-button
                                label={selectedLabel}
                                variant="neutral"
                                onclick={handleToggleSelected}>
                            </lightning-button>
                        </div>

                    </div>

                    <!-- AVAILABLE SITES -->
                    <div class="datatable-container">

                        <!-- Orders use a single radio selection. -->
                        <template if:true={isOrderMode}>
                            <lightning-datatable
                                key-field="Id"
                                data={availableSiteRows}
                                columns={siteColumns}
                                onrowselection={handleSelection}
                                selected-rows={selectedSiteIds}
                                max-row-selection="1"
                                sorted-by={sortedBy}
                                sorted-direction={sortDirection}
                                onsort={handleSort}>
                            </lightning-datatable>
                        </template>

                        <!-- Opportunity and Quote retain unrestricted multi-select. -->
                        <template if:false={isOrderMode}>
                            <lightning-datatable
                                key-field="Id"
                                data={availableSiteRows}
                                columns={siteColumns}
                                onrowselection={handleSelection}
                                selected-rows={selectedSiteIds}
                                sorted-by={sortedBy}
                                sorted-direction={sortDirection}
                                onsort={handleSort}>
                            </lightning-datatable>
                        </template>

                        <template if:false={availableSiteRows.length}>
                            <div class="empty-state">
                                No sites found.
                            </div>
                        </template>

                    </div>

                    <!-- SELECTED COUNT -->
                    <div class="slds-text-body_small slds-text-color_weak slds-m-top_small">
                        {selectedSiteIds.length} site(s) selected
                    </div>

                </div>

                <!-- FOOTER -->
                <div class="slds-modal__footer footer-container">

                    <div class="footer-actions">

                        <template if:true={isOrderMode}>
                            <lightning-button
                                label="Cancel"
                                variant="neutral"
                                onclick={handleCancel}>
                            </lightning-button>

                            <lightning-button
                                label="Save"
                                variant="brand"
                                onclick={handleOrderSave}
                                disabled={orderSaveDisabled}>
                            </lightning-button>
                        </template>

                        <template if:false={isOrderMode}>
                            <lightning-button
                                label="Back"
                                variant="neutral"
                                onclick={handleBack}>
                            </lightning-button>

                            <lightning-button
                                label="Cancel"
                                variant="neutral"
                                onclick={handleCancel}>
                            </lightning-button>

                            <lightning-button
                                label={selectSiteNextFooterLabel}
                                variant="brand"
                                onclick={handleNext}
                                disabled={nextDisabled}>
                            </lightning-button>
                        </template>

                    </div>

                </div>

            </template>

        </template>

        <!-- SHIPMENT SITE SELECTION SCREEN -->
        <template if:true={showPrimaryScreen}>

            <div class="slds-page-header">
                <div class="slds-page-header__row">

                    <div class="slds-page-header__col-title">
                        <div class="slds-media">
                            <div class="slds-media__figure">
                                <lightning-icon
                                    icon-name="standard:account"
                                    size="medium">
                                </lightning-icon>
                            </div>
                            <div class="slds-media__body">

                                <template if:true={isChangePrimaryMode}>
                                    <h2 class="slds-text-heading_medium">
                                        Change Shipment Site
                                    </h2>
                                </template>

                                <template if:false={isChangePrimaryMode}>
                                    <h2 class="slds-text-heading_medium">
                                        Select Shipment Site
                                    </h2>
                                </template>

                                <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                                    Optionally select a site to be designated as the Shipment Site.
                                </p>

                            </div>
                        </div>
                    </div>

                </div>
            </div>

            <div class="slds-p-around_medium">

                <div class="primary-table-container">

                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_fixed-layout">

                        <thead>
                            <tr class="slds-line-height_reset">
                                <th scope="col" class="radio-column"></th>
                                <th scope="col">
                                    <div class="slds-truncate">Site Name</div>
                                </th>
                                <th scope="col">
                                    <div class="slds-truncate">Shipping Address</div>
                                </th>
                            </tr>
                        </thead>

                        <tbody>

                            <template for:each={primarySelectionRows} for:item="site">

                                <tr key={site.Id}>

                                    <td>
                                        <lightning-input
                                            type="radio"
                                            variant="label-hidden"
                                            label="Select Shipment Site"
                                            name="primarySite"
                                            value={site.Id}
                                            checked={site.isPrimary}
                                            onchange={handlePrimarySelection}>
                                        </lightning-input>
                                    </td>

                                    <td>
                                        <div class="slds-truncate" title={site.Name}>
                                            {site.Name}
                                        </div>
                                    </td>

                                    <td>
                                        <div class="slds-truncate" title={site.shippingAddress}>
                                            {site.shippingAddress}
                                        </div>
                                    </td>

                                </tr>

                            </template>

                        </tbody>

                    </table>

                    <template if:false={primarySelectionRows.length}>
                        <div class="empty-state">
                            No sites found.
                        </div>
                    </template>

                </div>

            </div>

            <!-- FOOTER -->
            <div class="slds-modal__footer footer-container">

                <div class="footer-actions">

                    <lightning-button
                        label="Back"
                        variant="neutral"
                        onclick={handlePrimaryBack}>
                    </lightning-button>

                    <lightning-button
                        label="Cancel"
                        variant="neutral"
                        onclick={handleCancel}>
                    </lightning-button>

                    <template if:true={isChangePrimaryMode}>

                        <lightning-button
                            label="Update Shipment Site"
                            variant="brand"
                            onclick={handleSavePrimarySite}
                            disabled={primarySaveDisabled}>
                        </lightning-button>

                    </template>

                    <template if:false={isChangePrimaryMode}>

                        <lightning-button
                            label="Save Sites"
                            variant="brand"
                            onclick={handleSaveSites}
                            disabled={primarySaveDisabled}>
                        </lightning-button>

                    </template>

                </div>

            </div>

        </template>

    </div>

    <!-- CREATE SITE MODAL -->
    <template if:true={isCreateModalOpen}>

        <section
            role="dialog"
            tabindex="-1"
            aria-modal="true"
            aria-labelledby="create-site-heading"
            class="slds-modal slds-fade-in-open nested-modal">

            <div class="slds-modal__container">

                <header class="slds-modal__header">

                    <lightning-button-icon
                        icon-name="utility:close"
                        alternative-text="Close"
                        onclick={handleCloseCreateModal}
                        class="slds-modal__close">
                    </lightning-button-icon>

                    <h2
                        id="create-site-heading"
                        class="slds-text-heading_medium">
                        Create New Site
                    </h2>

                </header>

                <div class="slds-modal__content slds-p-around_medium">

                    <lightning-record-edit-form
                        object-api-name="Account"
                        record-type-id={siteRecordTypeId}
                        onsuccess={handleSiteCreated}>

                        <lightning-messages></lightning-messages>

                        <lightning-input-field
                            field-name="ParentId"
                            value={parentAccountId}
                            class="slds-hide">
                        </lightning-input-field>

                        <lightning-layout multiple-rows="true">
                            <template for:each={siteLayoutFields} for:item="field">
                                <lightning-layout-item
                                    key={field.fieldName}
                                    size="6"
                                    padding="horizontal-small">
                                    <lightning-input-field
                                        field-name={field.fieldName}>
                                    </lightning-input-field>
                                </lightning-layout-item>
                            </template>
                        </lightning-layout>

                        <div class="modal-footer">

                            <lightning-button
                                label="Cancel"
                                variant="neutral"
                                onclick={handleCloseCreateModal}>
                            </lightning-button>

                            <lightning-button
                                type="submit"
                                label="Create Site"
                                variant="brand">
                            </lightning-button>

                        </div>

                    </lightning-record-edit-form>

                </div>

            </div>

        </section>

        <div class="slds-backdrop slds-backdrop_open nested-backdrop">
        </div>

    </template>

</template>
