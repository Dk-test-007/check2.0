<template>
    <lightning-card title="Sales agreements and forecast">
        <div class="slds-p-horizontal_medium">
            <template lwc:if={loading}><lightning-spinner alternative-text="Loading" size="small"></lightning-spinner></template>
            <template lwc:if={error}><div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_small" role="alert">{error}</div></template>
            <template lwc:if={ctx}>
                <p class="slds-text-body_small slds-m-bottom_small">{ctx.accountName} · Opportunity {currency} <lightning-formatted-number value={ctx.amount}></lightning-formatted-number></p>
                <lightning-button label="Open account forecast" onclick={handleAccountForecast} variant="base"></lightning-button>
            </template>
            <template lwc:if={hasExisting}>
                <p class="slds-m-top_small">This opportunity already has a Sales Agreement. Its original plan is retained.</p>
                <lightning-button label={ctx.existingAgreementName} onclick={handleOpenAgreement} variant="brand-outline"></lightning-button>
            </template>
            <template lwc:if={hasSavedPlan}>
                <p class="slds-m-top_small">The initial monthly forecast is saved. Review or change the live forecast on the Account.</p>
            </template>
            <template lwc:if={tooEarly}>
                <p class="slds-m-top_small">The monthly forecast is completed when this New Business opportunity is ready to move from Negotiate to Closed Won.</p>
            </template>
            <template lwc:if={canPlan}>
                <p class="slds-text-body_small slds-m-vertical_small">Complete this step when the customer has agreed to buy and the Opportunity is ready for Closed Won. Enter the first monthly forecast and decide separately whether there is an agreement.</p>
                <div class="slds-grid slds-gutters slds-wrap">
                    <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4"><lightning-input type="month" label="Start month" value={startMonth} onchange={handleStart} required></lightning-input></div>
                    <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4"><lightning-input type="number" label="Forecast term (months)" min="1" max="18" value={term} onchange={handleTerm} required></lightning-input></div>
                </div>
                <div class="slds-box slds-m-top_medium slds-m-bottom_medium">
                    <h3 class="slds-text-heading_small">Sales agreement</h3>
                    <lightning-radio-group label="Is a sales agreement needed?" options={agreementOptions}
                        value={agreementChoice} onchange={handleAgreementChoice} type="radio" required></lightning-radio-group>
                    <template lwc:if={needsAgreementTerms}>
                        <lightning-textarea label="Agreed coverage and pricing terms" value={agreementSummary}
                            onchange={handleAgreementSummary} required
                            placeholder="Describe what is agreed, term, covered products, price or index terms, and any minimum order terms."></lightning-textarea>
                        <p class="slds-text-body_small">A draft agreement header will be created. The forecast quantities below are estimates and will not become contractual schedule quantities.</p>
                    </template>
                </div>
                <h3 class="slds-text-heading_small">Initial monthly forecast</h3>
                <p class="slds-text-body_small">Set each product by quantity or monthly value. Products can start in different months. Monthly totals must equal the Opportunity amount.</p>
                <div class="slds-m-top_medium slds-m-bottom_x-small">
                    <lightning-button label="Equal spread on first value line" onclick={handleEqual}></lightning-button>
                    <lightning-button label="Clear all" onclick={handleClear} class="slds-m-left_x-small"></lightning-button>
                    <lightning-button label="Add product" icon-name="utility:add" onclick={handleAddProduct} class="slds-m-left_x-small"></lightning-button>
                </div>
                <div class="grid-scroll">
                    <table class="slds-table slds-table_bordered slds-table_cell-buffer slds-table_col-bordered plan-grid">
                        <thead><tr><th scope="col">Product</th><th scope="col">Measure</th><th scope="col">Starts</th>
                            <template for:each={months} for:item="m"><th key={m.key} scope="col">{m.label}</th></template>
                            <th scope="col">Total {currency}</th><th scope="col"></th>
                        </tr></thead>
                        <tbody>
                            <template for:each={gridRows} for:item="row"><tr key={row.key}>
                                <td class="product-cell"><lightning-combobox variant="label-hidden" label="Product" data-key={row.key} options={productOptions} value={row.pricebookEntryId} onchange={handleProduct}></lightning-combobox></td>
                                <td class="mode-cell"><lightning-combobox variant="label-hidden" label="Measure" data-key={row.key} options={modeOptions} value={row.mode} onchange={handleMode}></lightning-combobox></td>
                                <td class="start-cell"><lightning-combobox variant="label-hidden" label="Product start month" data-key={row.key} options={monthOptions} value={row.startMonth} onchange={handleProductStart}></lightning-combobox></td>
                                <template for:each={row.cells} for:item="cell"><td key={cell.key} class="month-cell"><lightning-input variant="label-hidden" label="Monthly value" type="number" min="0" step={cell.step} value={cell.value} disabled={cell.disabled} data-row-key={cell.rowKey} data-index={cell.index} onchange={handleCell}></lightning-input></td></template>
                                <td><lightning-formatted-number value={row.total} minimum-fraction-digits={decimals}></lightning-formatted-number></td>
                                <td><lightning-button-icon icon-name="utility:delete" alternative-text="Remove product" data-key={row.key} onclick={handleRemoveProduct}></lightning-button-icon></td>
                            </tr></template>
                            <tr class="total-row"><th scope="row" colspan="3">Monthly total {currency}</th><template for:each={monthTotals} for:item="m"><td key={m.key}><lightning-formatted-number value={m.amount} minimum-fraction-digits={decimals}></lightning-formatted-number></td></template><td><lightning-formatted-number value={total} minimum-fraction-digits={decimals}></lightning-formatted-number></td><td></td></tr>
                        </tbody>
                    </table>
                </div>
                <p class={reconcileClass} role="status">{reconcileText}</p>
                <p class="slds-text-body_small slds-text-color_weak">Quantity lines use the current price book price. The monthly forecast feeds the Account forecast and can be edited there later.</p>
                <div class="slds-m-vertical_medium"><lightning-button variant="brand" label="Complete Closed Won and save forecast" onclick={handleSubmit} disabled={submitDisabled}></lightning-button></div>
            </template>
        </div>
    </lightning-card>
</template>
