name: Salesforce CI/CD Deployment

on:
  push:
    branches:
      - qa
      - uat
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment Environment"
        required: true
        type: choice
        options:
          - QA
          - UAT
          - PROD

# Default permissions are read-only; only the deploy job elevates to contents: write, and only for the step that moves the per-environment "last successful deploy" tag after a deploy actually succeeds.
permissions:
  contents: read

jobs:
  # JOB 1: VALIDATE BRANCH / INPUT AND RESOLVE TARGET ENVIRONMENT

  validate:
    name: Validate Deployment
    runs-on: ubuntu-latest

    outputs:
      env_name: ${{ steps.resolve.outputs.env_name }}
      org_alias: ${{ steps.resolve.outputs.org_alias }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve Target Environment
        id: resolve
        shell: bash
        run: |

          echo "======================================"
          echo "Salesforce CI/CD Validation"
          echo "======================================"

          BRANCH="${GITHUB_REF_NAME}"
          echo "Ref: $BRANCH"

          case "$BRANCH" in
            qa)   BRANCH_ENV_NAME="QA" ;;
            uat)  BRANCH_ENV_NAME="UAT" ;;
            main) BRANCH_ENV_NAME="PROD" ;;
            *)    BRANCH_ENV_NAME="" ;;
          esac

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            ENV_NAME="${{ inputs.environment }}"
            echo "Trigger: workflow_dispatch"
            echo "Requested Environment: $ENV_NAME"

            # A manual run must be dispatched from the same branch that owns the requested environment — otherwise this would let someone deploy, say, qa's code to prod just by picking PROD from the dropdown while running from the qa branch.
            if [ "$ENV_NAME" != "$BRANCH_ENV_NAME" ]; then
              echo "::error::workflow_dispatch requested environment '$ENV_NAME' but was run from branch '$BRANCH' (which maps to '${BRANCH_ENV_NAME:-<none>}'). Re-run this workflow from the branch that owns '$ENV_NAME'."
              exit 1
            fi

          else

            echo "Trigger: push"

            if [ -z "$BRANCH_ENV_NAME" ]; then
              echo "::error::Unsupported deployment branch: $BRANCH"
              exit 1
            fi

            ENV_NAME="$BRANCH_ENV_NAME"

          fi

          case "$ENV_NAME" in
            QA)   ORG_ALIAS="qa" ;;
            UAT)  ORG_ALIAS="uat" ;;
            PROD) ORG_ALIAS="prod" ;;
            *)
              echo "::error::Unsupported target environment: $ENV_NAME"
              exit 1
              ;;
          esac

          echo "Target Environment: $ENV_NAME"
          echo "Org Alias: $ORG_ALIAS"

          echo "env_name=$ENV_NAME" >> "$GITHUB_OUTPUT"
          echo "org_alias=$ORG_ALIAS" >> "$GITHUB_OUTPUT"

          echo "Branch/environment validation successful."

  # JOB 2: LINT (ESLint over aura/lwc) — blocks deploy on failure

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      # Non-blocking for now: force-app/main/default/aura and lwc are currently empty, so there's nothing for ESLint to genuinely fail on yet. Once real aura/lwc components land and this has run clean against them a few times, remove continue-on-error to make lint blocking.
      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

  # JOB 3: GENERATE DELTA MANIFEST (sfdx-git-delta)

  delta:
    name: Generate Delta Manifest
    needs: validate
    runs-on: ubuntu-latest

    outputs:
      mode: ${{ steps.base.outputs.mode }}
      has_changes: ${{ steps.summarize.outputs.has_changes }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine Deployment Baseline
        id: base
        shell: bash
        run: |

          # The baseline is the commit recorded by the last successful deploy to this org (a git tag moved only on deploy success — see the "Record Successful Deployment" step in the deploy job), not "the previous commit on this branch". That's what makes this correct across merge-based promotion (qa -> uat -> prod), workflow_dispatch re-runs, and retries after a failed deploy: the tag doesn't move on failure, so the next attempt's delta still includes whatever didn't make it in, plus anything new since.

          ORG_ALIAS="${{ needs.validate.outputs.org_alias }}"
          TAG_NAME="deployed-$ORG_ALIAS"

          if git rev-parse --verify --quiet "refs/tags/$TAG_NAME" > /dev/null; then

            FROM_SHA=$(git rev-parse "refs/tags/$TAG_NAME")
            echo "Last successful deploy to $ORG_ALIAS: $FROM_SHA"
            echo "mode=delta" >> "$GITHUB_OUTPUT"
            echo "from=$FROM_SHA" >> "$GITHUB_OUTPUT"

          elif [ "$ORG_ALIAS" = "prod" ]; then

            # Production never silently falls back to a full deploy. If this is genuinely the first-ever run against prod, seed the baseline deliberately from a terminal first: git tag deployed-prod <known-good-sha> && git push origin deployed-prod — then re-run this workflow.
            echo "::error::No 'deployed-prod' marker found. Refusing to run an unbaselined full deploy against production — seed the baseline tag manually (see comment above) before re-running."
            exit 1

          else

            echo "No '$TAG_NAME' marker found — no recorded successful deploy for this org yet."
            echo "Falling back to a full deploy generated from force-app."
            echo "mode=full" >> "$GITHUB_OUTPUT"

          fi

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Install sfdx-git-delta
        if: steps.base.outputs.mode == 'delta'
        run: |
          # `sf plugins install` asks an interactive y/N trust confirmation for unsigned plugins (sfdx-git-delta isn't Salesforce-signed) that never resolves in a non-TTY CI shell — the documented unsignedPluginAllowList.json bypass doesn't suppress it either; this is a known, unresolved sf CLI gap (forcedotcom/cli#2584). Installing the npm package directly and registering it with `sf plugins link` sidesteps the prompt entirely since linked (local dev) plugins skip the untrusted-registry trust check.
          # Pinned to major v6 — sfdx-git-delta's output layout has changed across major versions; re-verify these paths if the pin is bumped.
          npm install --no-save --prefix /tmp/sgd-install sfdx-git-delta@6
          sf plugins link /tmp/sgd-install/node_modules/sfdx-git-delta

      - name: Generate Delta Package
        id: build-delta
        if: steps.base.outputs.mode == 'delta'
        shell: bash
        run: |

          mkdir -p delta-output

          # --source-dir tolerates force-app not existing (sgd treats a missing folder as "no content there" rather than erroring) so this is safe even before any real metadata has been added.
          sf sgd source delta \
            --to "${{ github.sha }}" \
            --from "${{ steps.base.outputs.from }}" \
            --output-dir delta-output \
            --source-dir force-app \
            --generate-delta

          if grep -q "<types>" delta-output/package/package.xml 2>/dev/null; then
            echo "Delta contains metadata changes."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "Delta produced no metadata changes."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Full Manifest
        id: build-full
        if: steps.base.outputs.mode == 'full'
        shell: bash
        run: |

          # Unlike sgd, `sf project generate manifest --source-dir` hard-errors ("File or folder not found") if force-app doesn't exist at all rather than treating it as empty — which is the case on every branch until real metadata is first added. mkdir -p keeps this step from crashing in that state.
          mkdir -p force-app

          # Generated fresh from the current force-app tree rather than copied from a checked-in manifest/package.xml — a hand-maintained wildcard list goes stale as metadata types are added. This always reflects exactly what's on disk right now.
          sf project generate manifest \
            --source-dir force-app \
            --output-dir delta-output/package \
            --name package
          echo "Generated a full manifest from force-app (no prior successful deploy recorded for this org)."

          if grep -q "<types>" delta-output/package/package.xml 2>/dev/null; then
            echo "Manifest contains metadata."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "force-app has no metadata yet — nothing to deploy."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarize Delta Outcome
        id: summarize
        if: always()
        shell: bash
        run: |

          # if: always() — without it, this step is implicitly if: success() and gets silently skipped whenever an earlier step failed (e.g. the prod hard-stop above), leaving has_changes undefined instead of an explicit value.
          if [ "${{ steps.base.outputs.mode }}" = "full" ]; then
            echo "has_changes=${{ steps.build-full.outputs.has_changes }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.base.outputs.mode }}" = "delta" ]; then
            echo "has_changes=${{ steps.build-delta.outputs.has_changes }}" >> "$GITHUB_OUTPUT"
          else
            # Baseline resolution itself failed/produced no mode — default to "nothing to deploy" rather than an undefined output.
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Delta Summary
        if: always()
        shell: bash
        run: |

          {
            echo "### Delta Summary — ${{ needs.validate.outputs.env_name }}"
            echo ""
            echo "- **Mode:** ${{ steps.base.outputs.mode }}"
            echo "- **Has changes:** ${{ steps.summarize.outputs.has_changes }}"

            if [ -f delta-output/package/package.xml ]; then
              echo ""
              echo "<details><summary>package.xml</summary>"
              echo ""
              echo '```xml'
              cat delta-output/package/package.xml
              echo '```'
              echo "</details>"
            fi

            if [ -s delta-output/destructiveChanges/destructiveChanges.xml ]; then
              echo ""
              echo "<details><summary>destructiveChanges.xml</summary>"
              echo ""
              echo '```xml'
              cat delta-output/destructiveChanges/destructiveChanges.xml
              echo '```'
              echo "</details>"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Delta Manifest
        uses: actions/upload-artifact@v4
        with:
          name: delta-output
          path: delta-output

  # JOB 4: DEPLOY TO SALESFORCE — gated on validate + lint + delta all succeeding; runs under a GitHub Environment named after the resolved org alias (only "prod" has a required-reviewers rule configured under Settings > Environments, so this job pauses for manual approval only when deploying to production)

  deploy:
    name: Deploy to Salesforce
    needs: [validate, lint, delta]
    runs-on: ubuntu-latest

    # Elevated from the workflow-level contents: read default so the "Record Successful Deployment" step below can push the per-environment last-deployed tag; requires the repo's Actions settings to allow read/write workflow permissions.
    permissions:
      contents: write

    environment:
      name: ${{ needs.validate.outputs.org_alias }}

    concurrency:
      group: deploy-${{ needs.validate.outputs.org_alias }}
      cancel-in-progress: false

    # SFDX_AUTH_URL is a GitHub Environment secret — the same secret name exists in all 3 Environments (qa/uat/prod) with a different value in each; because this job's environment: above resolves dynamically to the matching org alias, GitHub itself resolves secrets.SFDX_AUTH_URL below to that environment's value — no per-branch secret-name lookup needed.
    env:
      SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}

    steps:
      # CHECKOUT (full source — the manifest only says which files to deploy, the files themselves must be present)

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Delta Manifest
        uses: actions/download-artifact@v4
        with:
          name: delta-output
          path: delta-output

      # INSTALL SALESFORCE CLI

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Verify Salesforce CLI
        run: sf --version

      # AUTHENTICATE TO SALESFORCE — SFDX_AUTH_URL resolves to the value stored in whichever GitHub Environment this job is running under (see env: above)

      - name: Authenticate to Salesforce
        shell: bash
        run: |

          ORG_ALIAS="${{ needs.validate.outputs.org_alias }}"

          if [ -z "$SFDX_AUTH_URL" ]; then
            echo "::error::SFDX_AUTH_URL is not set in the '$ORG_ALIAS' GitHub Environment. Add it under repo Settings > Environments > $ORG_ALIAS > Environment secrets."
            exit 1
          fi

          echo "$SFDX_AUTH_URL" | sf org login sfdx-url \
            --alias "$ORG_ALIAS" \
            --set-default \
            --sfdx-url-stdin

      - name: Verify Salesforce Authentication
        run: |
          sf org display --target-org "${{ needs.validate.outputs.org_alias }}" --verbose

      # VALIDATE THEN DEPLOY — dry-run validates + runs Apex tests once without touching the org; on success, quick-deploy commits that exact validated result without re-running tests

      - name: Validate Deployment (Dry Run)
        id: dry-run
        if: needs.delta.outputs.has_changes == 'true'
        shell: bash
        run: |

          ORG_ALIAS="${{ needs.validate.outputs.org_alias }}"

          echo "======================================"
          echo "Validating Salesforce Metadata (Dry Run)"
          echo "Environment: ${{ needs.validate.outputs.env_name }}"
          echo "Target Org: $ORG_ALIAS"
          echo "Delta Mode: ${{ needs.delta.outputs.mode }}"
          echo "======================================"

          # --post-destructive-changes deploys the new/changed metadata first and removes obsolete components afterward — this is SGD's documented deployment flow, avoiding a window where something still-referenced has already been deleted; NOTE: this ordering (and the sgd output path itself) has not yet been exercised against a real destructive change — verify with a supervised test (e.g. delete a field/class on a dev-org branch) before relying on it against uat/prod.
          DESTRUCTIVE_FLAG=""
          if [ -s delta-output/destructiveChanges/destructiveChanges.xml ]; then
            DESTRUCTIVE_FLAG="--post-destructive-changes delta-output/destructiveChanges/destructiveChanges.xml"
          fi

          sf project deploy start \
            --manifest delta-output/package/package.xml \
            $DESTRUCTIVE_FLAG \
            --target-org "$ORG_ALIAS" \
            --test-level RunLocalTests \
            --dry-run \
            --wait 30 \
            --json > dry-run-result.json

          cat dry-run-result.json

          JOB_ID=$(jq -r '.result.id' dry-run-result.json)
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"
          echo "Validation passed — job $JOB_ID is ready to quick-deploy."

      - name: Deploy to Salesforce (Quick Deploy)
        if: needs.delta.outputs.has_changes == 'true'
        shell: bash
        run: |

          ORG_ALIAS="${{ needs.validate.outputs.org_alias }}"

          echo "======================================"
          echo "Quick-Deploying Validated Job ${{ steps.dry-run.outputs.job_id }}"
          echo "Target Org: $ORG_ALIAS"
          echo "======================================"

          sf project deploy quick \
            --job-id "${{ steps.dry-run.outputs.job_id }}" \
            --target-org "$ORG_ALIAS" \
            --wait 30

      - name: No Changes To Deploy
        if: needs.delta.outputs.has_changes != 'true'
        run: echo "No metadata changes detected — skipping deploy."

      # RECORD SUCCESSFUL DEPLOYMENT — moves this org's "last successful deploy" tag to the current commit, only reached if every prior step in this job succeeded (deploy or no-op alike); this tag is what the next run's delta job diffs from, so it must only move on success

      - name: Record Successful Deployment
        if: success()
        shell: bash
        run: |

          ORG_ALIAS="${{ needs.validate.outputs.org_alias }}"
          TAG_NAME="deployed-$ORG_ALIAS"

          git tag -f "$TAG_NAME" "${{ github.sha }}"
          git push origin "refs/tags/$TAG_NAME" --force

          echo "Marked $TAG_NAME -> ${{ github.sha }} as the last successful deploy for $ORG_ALIAS."

      # DEPLOYMENT RESULT

      - name: Deployment Status
        if: always()
        run: |

          echo "======================================"
          echo "Salesforce Deployment Completed"
          echo "Branch/Ref: ${{ github.ref_name }}"
          echo "Environment: ${{ needs.validate.outputs.env_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Result: ${{ job.status }}"
          echo "======================================"
