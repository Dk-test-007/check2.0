name: Trigger Salesforce Deployment Pipeline

on:
  push:
    branches:
      - dev
      - qa
      - uat
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment Environment"
        required: true
        type: choice
        options:
          - DEV
          - QA
          - UAT
          - PROD

# This repo no longer performs the deployment itself — it only resolves the target
# environment and hands off to check2.0Pipeline, which owns the actual GitHub
# Environments, secrets, and required-reviewer approvals. Read-only is all this repo
# ever needs now; the old contents: write elevation (for tag pushes) moved with the
# tag-push step itself, into check2.0Pipeline.
permissions:
  contents: read

jobs:
  # JOB 1: VALIDATE BRANCH / INPUT AND RESOLVE TARGET ENVIRONMENT — unchanged from the
  # single-repo version; branch-to-environment naming is specific to this codebase, so
  # it stays here rather than moving into the shared pipeline repo.

  validate:
    name: Validate Deployment
    runs-on: ubuntu-latest

    outputs:
      env_name: ${{ steps.resolve.outputs.env_name }}
      org_alias: ${{ steps.resolve.outputs.org_alias }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve Target Environment
        id: resolve
        shell: bash
        run: |

          echo "======================================"
          echo "Salesforce CI/CD Validation"
          echo "======================================"

          BRANCH="${GITHUB_REF_NAME}"
          echo "Ref: $BRANCH"

          case "$BRANCH" in
            dev)  BRANCH_ENV_NAME="DEV" ;;
            qa)   BRANCH_ENV_NAME="QA" ;;
            uat)  BRANCH_ENV_NAME="UAT" ;;
            main) BRANCH_ENV_NAME="PROD" ;;
            *)    BRANCH_ENV_NAME="" ;;
          esac

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            ENV_NAME="${{ inputs.environment }}"
            echo "Trigger: workflow_dispatch"
            echo "Requested Environment: $ENV_NAME"

            # A manual run must be dispatched from the same branch that owns the requested environment — otherwise this would let someone deploy, say, dev's code to prod just by picking PROD from the dropdown while running from the dev branch.
            if [ "$ENV_NAME" != "$BRANCH_ENV_NAME" ]; then
              echo "::error::workflow_dispatch requested environment '$ENV_NAME' but was run from branch '$BRANCH' (which maps to '${BRANCH_ENV_NAME:-<none>}'). Re-run this workflow from the branch that owns '$ENV_NAME'."
              exit 1
            fi

          else

            echo "Trigger: push"

            if [ -z "$BRANCH_ENV_NAME" ]; then
              echo "::error::Unsupported deployment branch: $BRANCH"
              exit 1
            fi

            ENV_NAME="$BRANCH_ENV_NAME"

          fi

          case "$ENV_NAME" in
            DEV)  ORG_ALIAS="dev" ;;
            QA)   ORG_ALIAS="qa" ;;
            UAT)  ORG_ALIAS="uat" ;;
            PROD) ORG_ALIAS="prod" ;;
            *)
              echo "::error::Unsupported target environment: $ENV_NAME"
              exit 1
              ;;
          esac

          echo "Target Environment: $ENV_NAME"
          echo "Org Alias: $ORG_ALIAS"

          echo "env_name=$ENV_NAME" >> "$GITHUB_OUTPUT"
          echo "org_alias=$ORG_ALIAS" >> "$GITHUB_OUTPUT"

          echo "Branch/environment validation successful."

  # JOB 2: TRIGGER THE PIPELINE REPO — replaces the old lint/delta/deploy jobs entirely.
  # Everything that used to happen in this repo now happens in check2.0Pipeline, kicked
  # off via a repository_dispatch carrying exactly what that repo needs to check out and
  # deploy the right commit.

  trigger-pipeline:
    name: Trigger Pipeline Repo
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Dispatch to check2.0Pipeline
        shell: bash
        env:
          DISPATCH_TOKEN: ${{ secrets.CROSS_REPO_PAT }}
        run: |

          ORG_ALIAS="${{ needs.validate.outputs.org_alias }}"
          ENV_NAME="${{ needs.validate.outputs.env_name }}"

          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::error::CROSS_REPO_PAT is not set in this repo's secrets. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            "https://api.github.com/repos/Dk-test-007/check2.0Pipeline/dispatches" \
            -d "{\"event_type\":\"deploy-request\",\"client_payload\":{\"org_alias\":\"$ORG_ALIAS\",\"env_name\":\"$ENV_NAME\",\"sha\":\"${{ github.sha }}\",\"ref\":\"${{ github.ref }}\"}}")

          cat response.json 2>/dev/null || true

          # 204 No Content is GitHub's documented success response for this endpoint.
          if [ "$HTTP_STATUS" -ne 204 ]; then
            echo "::error::Failed to dispatch to check2.0Pipeline (HTTP $HTTP_STATUS). Check CROSS_REPO_PAT validity and its scope on check2.0Pipeline."
            exit 1
          fi

          echo "Dispatched deploy-request to check2.0Pipeline for $ENV_NAME ($ORG_ALIAS) at ${{ github.sha }}."
          echo "Actual deploy progress and result: https://github.com/Dk-test-007/check2.0Pipeline/actions"
          echo "Note: this job succeeding only means the request was accepted — it does not mean the deploy itself has finished or passed. The real outcome is reported back to this commit as a separate 'pipeline/deploy' status check once check2.0Pipeline's run completes."
